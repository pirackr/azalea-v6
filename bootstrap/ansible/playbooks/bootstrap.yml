---
# Bootstrap playbook - SSH key injection + Tailscale setup
#
# Run with password auth:
#   ansible-playbook -i inventory/bootstrap.yml playbooks/bootstrap.yml -u <user> -kK
#
# After this, you can use key-based auth with the deploy user
# and hosts are reachable via Tailscale hostnames

- name: Bootstrap bare metal hosts
  hosts: bare_metal
  become: true

  vars:
    deploy_user: deploy
    deploy_public_key: "{{ lookup('file', '../../../secrets/deploy_key.pub') }}"
    tailscale_authkey: "{{ lookup('pipe', '../../../bootstrap/scripts/decrypt-tailscale-key.sh') }}"

  tasks:
    # --- SSH Key Setup ---
    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        state: present

    - name: Set authorized key for deploy user
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_public_key }}"
        state: present
        exclusive: false

    - name: Allow deploy user passwordless sudo
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/deploy
        line: "{{ deploy_user }} ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Ensure SSH directory exists
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0700"

  roles:
    # --- Tailscale Setup ---
    - role: ../roles/tailscale
      vars:
        tailscale_accept_routes: true

  post_tasks:
    - name: Display success message
      ansible.builtin.debug:
        msg: |
          Bootstrap complete for {{ inventory_hostname }}!

          SSH access:
            ssh -i secrets/deploy_key deploy@{{ inventory_hostname }}

          Tailscale:
            Host is now reachable as: {{ inventory_hostname }}
            Tailscale IP: {{ tailscale_ip.stdout }}

          Next steps:
            1. Verify: ssh deploy@{{ inventory_hostname }}  (via Tailscale)
            2. Run full setup: ansible-playbook -i inventory/hosts.yml playbooks/site.yml
