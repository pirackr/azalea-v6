---
# Common role - base system configuration

# --- System Updates ---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
  register: apt_upgrade

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# --- Timezone ---
- name: Set timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Ensure chrony is installed for NTP
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Ensure chrony is running
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# --- Unattended Upgrades ---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  when: common_unattended_upgrades

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
  when: common_unattended_upgrades

- name: Enable automatic updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
  when: common_unattended_upgrades

# --- SSH Hardening ---
- name: Configure SSH daemon
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "sshd -t -f %s"
  loop:
    - { regexp: '^#?Port ', line: 'Port {{ common_ssh_port }}' }
    - { regexp: '^#?PasswordAuthentication ', line: 'PasswordAuthentication {{ "yes" if common_ssh_password_auth else "no" }}' }
    - { regexp: '^#?PermitRootLogin ', line: 'PermitRootLogin {{ "yes" if common_ssh_root_login else "no" }}' }
    - { regexp: '^#?PermitEmptyPasswords ', line: 'PermitEmptyPasswords {{ "yes" if common_ssh_permit_empty_passwords else "no" }}' }
    - { regexp: '^#?X11Forwarding ', line: 'X11Forwarding no' }
    - { regexp: '^#?MaxAuthTries ', line: 'MaxAuthTries 3' }
    - { regexp: '^#?ClientAliveInterval ', line: 'ClientAliveInterval 300' }
    - { regexp: '^#?ClientAliveCountMax ', line: 'ClientAliveCountMax 2' }
  notify: Restart SSH

# --- UFW Firewall ---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  when: common_ufw_enabled

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: "{{ common_ufw_default_incoming }}"
  when: common_ufw_enabled

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: "{{ common_ufw_default_outgoing }}"
  when: common_ufw_enabled

- name: Allow configured ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default('') }}"
  loop: "{{ common_ufw_allowed_ports }}"
  when: common_ufw_enabled

- name: Allow Tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in
  when: common_ufw_enabled

- name: Enable UFW
  community.general.ufw:
    state: enabled
  when: common_ufw_enabled

# --- Fail2ban ---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: common_fail2ban_enabled

- name: Configure fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
  notify: Restart fail2ban
  when: common_fail2ban_enabled

- name: Ensure fail2ban is running
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: common_fail2ban_enabled

# --- Sysctl Tuning ---
- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctl_settings | dict2items }}"

# --- Cleanup ---
- name: Remove unnecessary packages
  ansible.builtin.apt:
    autoremove: true
    purge: true

- name: Clean apt cache
  ansible.builtin.apt:
    autoclean: true
