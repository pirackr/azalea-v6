---
# Cilium CNI role - installs Cilium as the cluster CNI

- name: Check if Cilium CLI is installed
  ansible.builtin.stat:
    path: /usr/local/bin/cilium
  register: cilium_cli_check

- name: Download Cilium CLI
  ansible.builtin.get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/v{{ cilium_cli_version }}/cilium-linux-amd64.tar.gz"
    dest: /tmp/cilium-cli.tar.gz
    mode: "0644"
  when: not cilium_cli_check.stat.exists

- name: Extract Cilium CLI
  ansible.builtin.unarchive:
    src: /tmp/cilium-cli.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: not cilium_cli_check.stat.exists

- name: Check if Cilium is installed in cluster
  ansible.builtin.command: cilium status --wait=false
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: cilium_status
  changed_when: false
  failed_when: false
  become: false

- name: Install Cilium
  ansible.builtin.command: >
    cilium install
    --version {{ cilium_version }}
    --set kubeProxyReplacement={{ cilium_kube_proxy_replacement | lower }}
    --set hubble.enabled={{ cilium_hubble_enabled | lower }}
    --set hubble.relay.enabled={{ cilium_hubble_relay_enabled | lower }}
    --set hubble.ui.enabled={{ cilium_hubble_ui_enabled | lower }}
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  when: cilium_status.rc != 0
  register: cilium_install
  changed_when: cilium_install.rc == 0
  become: false

- name: Wait for Cilium core components to be ready
  ansible.builtin.shell: |
    # Wait for Cilium DaemonSet to be ready (core networking)
    kubectl wait --for=condition=ready pod -l k8s-app=cilium -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: cilium_ready
  retries: 3
  delay: 10
  until: cilium_ready.rc == 0
  changed_when: false
  become: false

- name: Display Cilium status
  ansible.builtin.command: cilium status
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: cilium_final_status
  changed_when: false
  become: false

- name: Show Cilium status
  ansible.builtin.debug:
    msg: "{{ cilium_final_status.stdout_lines }}"
