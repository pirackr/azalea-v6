---
# Node Exporter defaults

node_exporter_version: "1.8.2"
node_exporter_port: 9100
node_exporter_user: node_exporter
node_exporter_group: node_exporter

# Collectors to enable (empty = defaults)
node_exporter_enabled_collectors: []

# Extra groups to add to the node_exporter user
node_exporter_additional_groups: []

# Powercap (RAPL) permissions
node_exporter_powercap_enable: true
node_exporter_powercap_group: powercap

# Collectors to disable
node_exporter_disabled_collectors:
  - infiniband
  - nfs
  - nfsd
