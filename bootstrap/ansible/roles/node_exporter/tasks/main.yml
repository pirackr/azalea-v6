---
# Install and configure Prometheus Node Exporter

- name: Check if node_exporter is installed
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exporter_binary

- name: Get installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed_version
  changed_when: false
  failed_when: false
  when: node_exporter_binary.stat.exists

- name: Install node_exporter
  when: >
    not node_exporter_binary.stat.exists or
    node_exporter_version not in (node_exporter_installed_version.stderr | default(''))
  block:
    - name: Create node_exporter group
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        system: true
        state: present

    - name: Create node_exporter user
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        group: "{{ node_exporter_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Ensure powercap group exists
      ansible.builtin.group:
        name: "{{ node_exporter_powercap_group }}"
        system: true
        state: present
      when: node_exporter_powercap_enable

    - name: Add node_exporter user to powercap group
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        groups: "{{ node_exporter_additional_groups + [node_exporter_powercap_group] }}"
        append: true
      when: node_exporter_powercap_enable

    - name: Allow powercap energy reads for powercap group
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-powercap.rules
        mode: "0644"
        content: |
          SUBSYSTEM=="powercap", RUN+="/bin/chgrp {{ node_exporter_powercap_group }} /sys/class/powercap/%k/energy_uj"
          SUBSYSTEM=="powercap", RUN+="/bin/chmod 0640 /sys/class/powercap/%k/energy_uj"
      when: node_exporter_powercap_enable

    - name: Reload udev rules for powercap
      ansible.builtin.command: udevadm control --reload-rules
      when: node_exporter_powercap_enable
      changed_when: false

    - name: Trigger powercap udev rules
      ansible.builtin.command: udevadm trigger --subsystem-match=powercap
      when: node_exporter_powercap_enable
      changed_when: false

    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

    - name: Clean up temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/node_exporter.tar.gz
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"

- name: Create node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
