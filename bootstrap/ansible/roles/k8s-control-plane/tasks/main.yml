---
# K8s Control Plane role - initializes the Kubernetes control plane

- name: Check if cluster is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --service-cidr={{ service_cidr }}
    --control-plane-endpoint={{ control_plane_endpoint }}
    --apiserver-advertise-address={{ ansible_tailscale0.ipv4.address }}
    --apiserver-cert-extra-sans={{ apiserver_cert_extra_sans | join(',') }}
    --skip-phases=addon/kube-proxy
  when: not kubeadm_init_check.stat.exists
  register: kubeadm_init
  changed_when: kubeadm_init.rc == 0

- name: Create .kube directory for deploy user
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"

- name: Copy admin.conf to deploy user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ kubeconfig_dir }}/config"
    remote_src: true
    owner: deploy
    group: deploy
    mode: "0600"

- name: Read kube-proxy config
  ansible.builtin.command: >
    kubectl get configmap -n kube-system kube-proxy
    -o jsonpath='{.data.config\.conf}'
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/config"
  register: kube_proxy_conf
  changed_when: false
  become: false

- name: Ensure kube-proxy cluster CIDR is set
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n kube-system get configmap kube-proxy -o json | python - <<'PY'
    import json,sys
    cm=json.load(sys.stdin)
    cfg=cm["data"]["config.conf"]
    cfg=cfg.replace('clusterCIDR: ""', 'clusterCIDR: "{{ kube_proxy_cluster_cidr }}"')
    cm["data"]["config.conf"]=cfg
    print(json.dumps(cm))
    PY
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/config"
  register: kube_proxy_patch
  changed_when: kube_proxy_patch.rc == 0
  when: "'clusterCIDR: \"\"' in kube_proxy_conf.stdout"
  become: false

- name: Apply kube-proxy config
  ansible.builtin.command: kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/config"
  args:
    stdin: "{{ kube_proxy_patch.stdout }}"
  register: kube_proxy_apply
  changed_when: kube_proxy_apply.rc == 0
  when: kube_proxy_patch is changed
  become: false

- name: Restart kube-proxy pods after config change
  ansible.builtin.command: kubectl delete pod -n kube-system -l k8s-app=kube-proxy
  environment:
    KUBECONFIG: "{{ kubeconfig_dir }}/config"
  when: kube_proxy_apply is changed
  changed_when: false
  become: false

- name: Generate join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command
  changed_when: false

- name: Store join command for workers
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command.stdout }}"

- name: Save join command to file
  ansible.builtin.copy:
    content: "{{ join_command.stdout }}"
    dest: /etc/kubernetes/join-command
    mode: "0600"

- name: Display cluster info
  ansible.builtin.debug:
    msg: |
      Kubernetes control plane initialized!

      Control plane endpoint: {{ control_plane_endpoint }}
      Pod network CIDR: {{ pod_network_cidr }}

      To access the cluster:
        export KUBECONFIG={{ kubeconfig_dir }}/config
        kubectl get nodes
