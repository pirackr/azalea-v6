---
# Flannel CNI role - installs Flannel as the cluster CNI

- name: Check if Flannel is already installed
  ansible.builtin.command: kubectl get daemonset -n kube-flannel kube-flannel-ds
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: flannel_check
  changed_when: false
  failed_when: false
  become: false

- name: Download Flannel manifest
  ansible.builtin.get_url:
    url: "{{ flannel_manifest_url }}"
    dest: /tmp/kube-flannel.yml
    mode: "0644"
  when: flannel_check.rc != 0

- name: Apply Flannel manifest
  ansible.builtin.command: kubectl apply -f /tmp/kube-flannel.yml
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  when: flannel_check.rc != 0
  register: flannel_install
  changed_when: flannel_install.rc == 0
  become: false

- name: Configure Flannel to use Tailscale interface
  ansible.builtin.command: >
    kubectl patch daemonset -n kube-flannel kube-flannel-ds
    --type='json'
    -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--iface={{ flannel_iface }}"}]'
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  when: flannel_check.rc != 0
  register: flannel_patch
  changed_when: flannel_patch.rc == 0
  become: false

- name: Wait for Flannel pods to be ready
  ansible.builtin.shell: |
    kubectl wait --for=condition=ready pod -l app=flannel -n kube-flannel --timeout=120s
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: flannel_ready
  retries: 3
  delay: 10
  until: flannel_ready.rc == 0
  changed_when: false
  become: false

- name: Verify Flannel is running
  ansible.builtin.command: kubectl get pods -n kube-flannel
  environment:
    KUBECONFIG: /home/deploy/.kube/config
  register: flannel_status
  changed_when: false
  become: false

- name: Show Flannel status
  ansible.builtin.debug:
    msg: "{{ flannel_status.stdout_lines }}"
