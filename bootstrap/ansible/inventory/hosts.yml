# Azalea v6 - Ansible Inventory (Production)
# Use after bootstrap - requires Tailscale or update IPs
#
# Hostnames resolve via Tailscale MagicDNS after setup

all:
  children:
    # Bare metal nodes (habitats)
    bare_metal:
      hosts:
        golden-savanna:
          node_role: primary
          hypervisor_autostart_vms:
            - sleepy-koala
            - lazy-panda
        misty-bamboo:
          node_role: worker
          hypervisor_autostart_vms:
            - chunky-wombat
            - fancy-penguin
        lush-forest:
          node_role: worker
          hypervisor_autostart_vms:
            - grumpy-walrus
            - happy-dolphin

    # K8s VMs (animals) - created by Terraform
    k8s_control_plane:
      hosts:
        sleepy-koala:
      vars:
        tailscale_advertise_routes: "10.0.0.0/8,10.96.0.0/12"
        # Control plane advertises routes but must NOT accept them
        tailscale_accept_routes: false

    k8s_workers:
      hosts:
        lazy-panda:
        chunky-wombat:
        fancy-penguin:
        grumpy-walrus:
        happy-dolphin:
      vars:
        # Workers must NOT accept routes - conflicts with Cilium pod routing
        tailscale_accept_routes: false

    # All K8s nodes
    k8s_nodes:
      children:
        k8s_control_plane:
        k8s_workers:

  vars:
    ansible_user: deploy
    # SSH key path injected via Doppler (run.sh wrapper)
    ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_PRIVATE_KEY_FILE') }}"
    ansible_python_interpreter: /usr/bin/python3
