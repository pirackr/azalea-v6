# Azalea v6 - Ansible Inventory
# Hostnames resolve via Tailscale MagicDNS

all:
  children:
    # Bare metal nodes (habitats)
    bare_metal:
      hosts:
        golden-savanna:
          node_role: primary
        misty-bamboo:
          node_role: worker
        lush-rainforest:
          node_role: worker

    # K8s control plane nodes
    k8s_control_plane:
      hosts:
        golden-savanna:

    # K8s worker nodes
    k8s_workers:
      hosts:
        misty-bamboo:
        lush-rainforest:

    # All K8s nodes
    k8s_nodes:
      children:
        k8s_control_plane:
        k8s_workers:

    # VMs (animals) - add as created
    vms:
      hosts:
        # sleepy-koala:
        # lazy-panda:
        # chunky-wombat:
        # fancy-penguin:

  vars:
    ansible_python_interpreter: /usr/bin/python3
