# Azalea v6 - Ansible Inventory (Production)
# Use after bootstrap - requires Tailscale or update IPs
#
# Hostnames resolve via Tailscale MagicDNS after setup

all:
  children:
    # Bare metal nodes (habitats)
    bare_metal:
      hosts:
        golden-savanna:
          node_role: primary
        misty-bamboo:
          node_role: worker
        # lush-rainforest:  # Add when ready
        #   node_role: worker

    # K8s VMs (animals) - created by Terraform
    k8s_control_plane:
      hosts:
        sleepy-koala:

    k8s_workers:
      hosts:
        lazy-panda:
        # chunky-wombat:  # Deploy misty-bamboo VMs first
        # fancy-penguin:  # Deploy misty-bamboo VMs first

    # All K8s nodes
    k8s_nodes:
      children:
        k8s_control_plane:
        k8s_workers:

  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: "{{ playbook_dir }}/../../../secrets/deploy_key"
    ansible_python_interpreter: /usr/bin/python3
