---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: org-tides
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: master
  secretRef:
    name: flux-system
  url: ssh://git@github.com/pirackr/org-tides
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: org-tides
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: org-tides
  path: ./kubernetes
  prune: true
  wait: true
  timeout: 5m0s
