---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

configMapGenerator:
  - name: thermal-monitoring-dashboard
    files:
      - thermal-monitoring.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: open-meteo-weather-dashboard
    files:
      - open-meteo-weather.json
    options:
      labels:
        grafana_dashboard: "1"
