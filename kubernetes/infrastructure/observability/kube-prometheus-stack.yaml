---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "67.x"  # Latest 67.x version
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 10m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 10m
  values:
    # Grafana config
    grafana:
      enabled: true
      adminPassword: "admin"  # Change this or use a secret
      persistence:
        enabled: true
        size: 5Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Add Loki datasource
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.observability.svc:3100
          access: proxy
          isDefault: false
      # Import dashboards from Grafana.com
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: 'grafana-dashboards'
              orgId: 1
              folder: 'Imported'
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/grafana-dashboards
      dashboards:
        grafana-dashboards:
          # Node Exporter Full - comprehensive host metrics
          node-exporter-full:
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          # Node Exporter - simpler view
          node-exporter:
            gnetId: 11074
            revision: 9
            datasource: Prometheus
          # Loki Logs Dashboard
          loki-logs:
            gnetId: 13639
            revision: 2
            datasource: Loki
          # FluxCD Dashboard
          fluxcd:
            gnetId: 16714
            revision: 1
            datasource: Prometheus
          # Kubernetes dashboards
          k8s-global:
            gnetId: 15757
            revision: 43
            datasource: Prometheus
          k8s-namespaces:
            gnetId: 15758
            revision: 38
            datasource: Prometheus
          k8s-nodes:
            gnetId: 15759
            revision: 32
            datasource: Prometheus
          k8s-pods:
            gnetId: 15760
            revision: 32
            datasource: Prometheus
          k8s-cluster:
            gnetId: 7249
            revision: 1
            datasource: Prometheus
          # Cilium CNI dashboard
          cilium:
            gnetId: 16611
            revision: 1
            datasource: Prometheus

    # Prometheus config
    prometheus:
      prometheusSpec:
        retention: 7d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        # Scrape bare metal and VM hosts via Tailscale
        additionalScrapeConfigs:
          - job_name: 'bare-metal-nodes'
            static_configs:
              - targets:
                  - 'golden-savanna:9100'
                  - 'misty-bamboo:9100'
                  - 'lush-forest:9100'
                labels:
                  tier: bare-metal
          - job_name: 'k8s-vm-hosts'
            static_configs:
              - targets:
                  - 'sleepy-koala:9100'
                  - 'lazy-panda:9100'
                  - 'chunky-wombat:9100'
                  - 'fancy-penguin:9100'
                  - 'grumpy-walrus:9100'
                  - 'happy-dolphin:9100'
                labels:
                  tier: vm-host

    # Alertmanager config
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ['alertname', 'namespace', 'severity']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: 'ntfy-alerts'
          routes:
            - receiver: 'ntfy-alerts'
              matchers:
                - alertname="NodeDown"
              group_by: ['alertname', 'instance']
              repeat_interval: 8737h
              continue: false
            - receiver: 'ntfy-alerts'
              matchers:
                - alertname="KubeDaemonSetRolloutStuck"
              group_by: ['alertname', 'namespace', 'daemonset']
              repeat_interval: 8737h
              continue: false
            - receiver: 'ntfy-alerts'
              matchers:
                - severity=~"critical|warning"
              continue: false
        receivers:
          - name: 'ntfy-alerts'
            webhook_configs:
              - url: 'http://alertmanager-ntfy:8000/hook'
                send_resolved: true
                http_config:
                  basic_auth:
                    username: alertmanager
                    password_file: /etc/alertmanager/secrets/alertmanager-ntfy/webhook_password
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: ['alertname', 'namespace']
      alertmanagerSpec:
        secrets:
          - alertmanager-ntfy
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    # Disable components not needed for homelab
    kubeEtcd:
      enabled: false  # etcd metrics not accessible in kubeadm
    kubeControllerManager:
      enabled: false  # Not accessible by default
    kubeScheduler:
      enabled: false  # Not accessible by default
    kubeProxy:
      enabled: false  # Using Cilium, no kube-proxy

    # Node exporter for host metrics
    nodeExporter:
      enabled: false

    # Prometheus Operator
    prometheusOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
