apiVersion: apps/v1
kind: Deployment
metadata:
  name: org-graphql
  namespace: org
  labels:
    app.kubernetes.io/name: org-graphql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: org-graphql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: org-graphql
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ssh-pod
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-org-dir
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/org
              chown -R 1000:1000 /data/org
              chmod -R g+rwX /data/org
              chmod g+s /data/org
          volumeMounts:
            - name: org-data
              mountPath: /data
      containers:
        - name: org-graphql
          image: ghcr.io/pirackr/org-graphql:sha-fd97793
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ORG_BACKEND_ORG_DIR
              value: /data/org
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: org-data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: org-data
          persistentVolumeClaim:
            claimName: ssh-pod-data
