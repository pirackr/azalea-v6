apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              cnpg.io/cluster: postgres
          topologyKey: kubernetes.io/hostname
  storage:
    size: 10Gi
    storageClass: longhorn
  managed:
    roles:
      - name: nextcloud
        login: true
        passwordSecret:
          name: postgres-nextcloud
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
