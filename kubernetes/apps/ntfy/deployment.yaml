---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      initContainers:
        - name: init-users
          image: binwiederhier/ntfy:latest
          env:
            - name: NTFY_AUTH_FILE
              value: "/var/cache/ntfy/auth.db"
            - name: NTFY_AUTH_DEFAULT_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-config
                  key: NTFY_AUTH_DEFAULT_ACCESS
            - name: NTFY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ntfy-config
                  key: NTFY_ADMIN_USER
            - name: NTFY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ntfy-config
                  key: NTFY_ADMIN_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              # Create admin user if not exists
              if ! ntfy user list | grep -q "^user ${NTFY_ADMIN_USER}"; then
                printf '%s\n%s\n' "$NTFY_ADMIN_PASSWORD" "$NTFY_ADMIN_PASSWORD" | ntfy user add --role=admin "$NTFY_ADMIN_USER"
                echo "Created admin user: $NTFY_ADMIN_USER"
              else
                echo "Admin user already exists: $NTFY_ADMIN_USER"
              fi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          args:
            - serve
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: NTFY_BASE_URL
              value: "https://ntfy.pirackr.xyz"
            - name: NTFY_CACHE_FILE
              value: "/var/cache/ntfy/cache.db"
            - name: NTFY_AUTH_FILE
              value: "/var/cache/ntfy/auth.db"
            - name: NTFY_AUTH_DEFAULT_ACCESS
              valueFrom:
                secretKeyRef:
                  name: ntfy-config
                  key: NTFY_AUTH_DEFAULT_ACCESS
            - name: NTFY_UPSTREAM_BASE_URL
              value: "https://ntfy.sh"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: cache
              mountPath: /var/cache/ntfy
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ntfy-cache
