apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
  labels:
    app.kubernetes.io/name: radicale
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radicale
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicale
    spec:
      containers:
        - name: radicale
          image: ghcr.io/kozea/radicale:3
          args:
            - --config
            - /etc/radicale/config
          ports:
            - name: http
              containerPort: 5232
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/radicale/config
              subPath: config
              readOnly: true
            - name: auth
              mountPath: /etc/radicale/users
              subPath: users
              readOnly: true
            - name: data
              mountPath: /var/lib/radicale
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: radicale-config
        - name: auth
          secret:
            secretName: radicale-auth
        - name: data
          persistentVolumeClaim:
            claimName: radicale-data
