# App Template - Copy this directory for new apps
# Replace APP_NAME with your application name

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: APP_NAME

resources:
  - namespace.yaml
  # - deployment.yaml
  # - service.yaml
  # - ingress.yaml

commonLabels:
  app.kubernetes.io/name: APP_NAME
  app.kubernetes.io/part-of: azalea-homelab
