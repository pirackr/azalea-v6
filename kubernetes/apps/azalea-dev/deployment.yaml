apiVersion: apps/v1
kind: Deployment
metadata:
  name: azalea-dev
  namespace: dev
  labels:
    app.kubernetes.io/name: azalea-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: azalea-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azalea-dev
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: init-home
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /home/pirackr/.ssh /home/pirackr/.kube
              chmod 700 /home/pirackr/.ssh
              chmod 700 /home/pirackr/.kube
              chown -R 1000:1000 /home/pirackr
          volumeMounts:
            - name: home
              mountPath: /home/pirackr
      containers:
        - name: azalea-dev
          image: ghcr.io/pirackr/azalea-dev:latest
          imagePullPolicy: Always
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: HOME
              value: /home/pirackr
            - name: KUBECONFIG
              value: /home/pirackr/.kube/config
          volumeMounts:
            - name: home
              mountPath: /home/pirackr
            - name: ssh-keys
              mountPath: /home/pirackr/.ssh/authorized_keys
              subPath: authorized_keys
              readOnly: true
            - name: kubeconfig
              mountPath: /home/pirackr/.kube/config
              subPath: config
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: azalea-dev-home
        - name: ssh-keys
          configMap:
            name: azalea-dev-ssh
        - name: kubeconfig
          secret:
            secretName: azalea-dev-kubeconfig
