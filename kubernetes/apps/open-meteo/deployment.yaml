apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-meteo-pushgateway
  namespace: open-meteo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-meteo-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-meteo-pushgateway
    spec:
      containers:
        - name: pushgateway
          image: prom/pushgateway:v1.8.0
          ports:
            - name: http
              containerPort: 9091
          args:
            - --web.listen-address=:9091
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
