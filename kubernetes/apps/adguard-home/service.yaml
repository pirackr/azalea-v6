---
# Web UI service (ClusterIP for internal/Cloudflare access)
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-web
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: ClusterIP
  ports:
    - name: http-initial
      port: 3000
      targetPort: http-initial
      protocol: TCP
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: adguard-home
---
# DNS service (NodePort for network-wide DNS)
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: NodePort
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      nodePort: 30053
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      nodePort: 30053
      protocol: UDP
  selector:
    app.kubernetes.io/name: adguard-home
