---
# Web UI service (NodePort for Tailscale access)
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-web
  namespace: adguard-home
  labels:
    app.kubernetes.io/name: adguard-home
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
  selector:
    app.kubernetes.io/name: adguard-home
---
# DNS is exposed directly on node's port 53 via hostNetwork mode
# No separate DNS service needed
