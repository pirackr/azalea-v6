apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web
  strategy:
    type: Recreate  # Required for RWO volumes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web
    spec:
      initContainers:
        - name: init-calibre-db
          image: lscr.io/linuxserver/calibre:latest
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /books/metadata.db ]; then
                echo "Creating Calibre library..."
                calibredb --with-library=/books list 2>/dev/null || true
                ls -la /books/
              fi
              echo "Setting permissions..."
              chown -R 1000:1000 /books
              chmod -R 755 /books
              ls -la /books/
          volumeMounts:
            - name: books
              mountPath: /books
      containers:
        - name: calibre-web
          image: lscr.io/linuxserver/calibre-web:latest
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
          resources:
            requests:
              memory: "1024Mi"
              cpu: "1000m"
            limits:
              memory: "2024Mi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web-config-longhorn
        - name: books
          persistentVolumeClaim:
            claimName: calibre-web-books-longhorn
