apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-config-local-path
  namespace: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-books-local-path
  namespace: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
