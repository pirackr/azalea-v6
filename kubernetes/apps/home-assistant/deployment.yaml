apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: init-config
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ ! -f /config/configuration.yaml ]; then
                cat > /config/configuration.yaml <<'EOF'
              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
                  - 100.64.0.0/10
              EOF
              elif ! grep -q "trusted_proxies" /config/configuration.yaml; then
                cat >> /config/configuration.yaml <<'EOF'

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16
                  - 10.96.0.0/12
                  - 100.64.0.0/10
              EOF
              fi
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:stable
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
